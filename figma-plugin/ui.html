<style>
  body { font: 12px/1.5 -apple-system, "PingFang SC", sans-serif; margin: 10px 12px; color: #202622; }
  #state { font-weight: 600; }
  #detail { color: #6F7A74; word-break: break-all; }
  .ok { color: #047857; }
  .off { color: #DC2626; }
</style>
<div>Marionette</div>
<div id="state" class="off">Connecting…</div>
<div id="detail">Marionette app · http://127.0.0.1:3055</div>
<script>
  const SERVER = "http://127.0.0.1:3055";
  // Written by the Marionette app when it extracts this plugin.
  const HEADERS = { "X-Marionette-Token": "__MARIONETTE_TOKEN__" };
  // Tells this file's copy of the plugin apart from those in other files.
  const PLUGIN = Array.from(crypto.getRandomValues(new Uint8Array(4)), (b) => b.toString(16).padStart(2, "0")).join("");
  let file = null; // {name, key, page}, from code.js
  let current = null; // id of the script being run, if any
  let inflight = false;
  let done = 0;
  const stateEl = document.getElementById("state");
  const detailEl = document.getElementById("detail");
  const setState = (ok, text, detail) => {
    stateEl.className = ok ? "ok" : "off";
    stateEl.textContent = text;
    if (detail !== undefined) detailEl.textContent = detail;
  };

  async function tick() {
    if (inflight || !file) return;
    inflight = true;
    const q = "/pull?" + new URLSearchParams({ plugin: PLUGIN, file: file.name, key: file.key, page: file.page });
    try {
      if (current) {
        // Heartbeat, so the app knows the script is still running.
        await fetch(SERVER + q + "&busy=" + current, { headers: HEADERS });
        return;
      }
      const r = await fetch(SERVER + q, { headers: HEADERS });
      const j = await r.json();
      if (!r.ok) {
        setState(false, "Refused by the Marionette app", j.error || "status " + r.status);
      } else if (j.job) {
        current = j.job.id;
        setState(true, "Running…", "job " + j.job.id.slice(0, 8));
        parent.postMessage({ pluginMessage: { type: "run", id: j.job.id, code: j.job.code } }, "*");
      } else {
        setState(true, "Connected · idle", done + " script(s) completed");
      }
    } catch (e) {
      setState(false, "Marionette app not running", "Open the Marionette app on this computer");
    } finally {
      inflight = false;
    }
  }

  onmessage = async (e) => {
    const m = e.data.pluginMessage;
    if (m && m.type === "file") {
      file = m;
      return;
    }
    if (!m || m.type !== "result") return;
    try {
      await fetch(SERVER + "/result?id=" + encodeURIComponent(m.id), {
        method: "POST",
        headers: { ...HEADERS, "Content-Type": "application/json" },
        body: JSON.stringify(m),
      });
    } catch (_) { /* app gone; it fails the job when the heartbeat stops */ }
    current = null;
    done++;
  };

  parent.postMessage({ pluginMessage: { type: "hello" } }, "*");
  setInterval(tick, 500);
</script>
