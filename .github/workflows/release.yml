name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # The .app needs cgo + lipo + codesign; Windows and headless Linux are pure Go.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make release-macos VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.tar.gz

  linux:
    # The Linux window needs cgo against GTK + WebKitGTK, so each arch builds
    # natively. Ubuntu 22.04 keeps the glibc requirement at 2.35.
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make test
      - run: make release-linux VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
            --title "Marionette $GITHUB_REF_NAME" --generate-notes
